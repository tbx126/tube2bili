<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>Tube2Bili</title>
  <link rel="stylesheet" href="/static/style.css?v=0.2.0-rc.33"><script src="/static/app.js?v=0.2.0-rc.33" defer></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7l5 5-5 5" stroke="#fff"/><path d="M13 17h6" class="mark-accent"/></svg></span><strong>Tube2Bili</strong></div>
      <div><h1>登录工作台</h1><p class="sub">YouTube 新视频自动配上中英字幕，转载到 B 站。</p></div>
      <div class="card stack">
        <label class="field">密码<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="btn btn-dark btn-lg" type="submit">登录 <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <p class="hint">密码是 NAS 上 <code>.env</code> 文件里的 <code>DASHBOARD_PASSWORD</code>。</p>
    </form>
  </div>

  <div id="shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#today"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7l5 5-5 5" stroke="#fff"/><path d="M13 17h6" class="mark-accent"/></svg></span><strong>Tube2Bili</strong></a>
        <nav class="nav" aria-label="主导航">
          <a href="#today" data-page="today">今天</a>
          <a href="#tasks" data-page="tasks">任务 <span id="queue-count" class="count">0</span></a>
          <a href="#channels" data-page="channels">频道</a>
          <a href="#settings" data-page="settings">设置</a>
        </nav>
        <div class="topbar-right">
          <button class="btn add-trigger" data-action="add"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>粘贴视频或频道链接…</span></button>
          <span id="connection" class="conn"><i class="dot"></i><span>正在连接</span></span>
          <button class="btn btn-quiet" data-action="logout">退出</button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" aria-label="主导航（手机）">
      <a href="#today" data-page="today"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>今天</a>
      <a href="#tasks" data-page="tasks"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>任务</a>
      <a href="#channels" data-page="channels"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10"/></svg>频道</a>
      <a href="#settings" data-page="settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg>设置</a>
    </nav>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="btn btn-quiet btn-icon" data-action="close" aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="modal-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
