<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tube2Bili · 视频工作台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23bef264'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='800' fill='%23111a23' text-anchor='middle'%3Etb%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="login" class="login-wrap" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-mark">tb</div>
      <p class="eyebrow">YOUR PERSONAL VIDEO PIPELINE</p>
      <h1>让内容跨越语言。</h1>
      <p class="muted">登录 Tube2Bili，管理你的双语视频工作流。</p>
      <label>工作台密码
        <input name="password" type="password" autocomplete="current-password" placeholder="请输入访问密码" required>
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit">
        <span>进入工作台</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <small>密码在 NAS 的 .env 文件中配置。</small>
    </form>
  </div>
  <div id="shell" hidden>
    <aside>
      <a class="brand" href="#overview">
        <span class="brand-mark">tb</span>
        <strong>Tube2Bili<span>视频工作台</span></strong>
      </a>
      <div class="workspace">
        <span class="avatar">P</span>
        <div class="workspace-info">
          <strong>个人工作空间</strong>
          <small>NAS · 单账号</small>
        </div>
        <span class="live-dot" title="系统活跃中"></span>
      </div>
      <p class="nav-label">工作空间</p>
      <nav aria-label="主导航">
        <a href="#overview" data-page="overview">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span>总览</span>
        </a>
        <a href="#tasks" data-page="tasks">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
          <span>任务队列</span>
          <span id="queue-count" class="nav-count">0</span>
        </a>
        <a href="#channels" data-page="channels">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M7.76 7.76a6 6 0 0 0 0 8.48"/><path d="M16.24 7.76a6 6 0 0 1 0 8.48"/></svg></span>
          <span>频道订阅</span>
        </a>
        <a href="#settings" data-page="settings">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span>服务设置</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="small-label">存储策略</div>
        <strong>内容长期留存</strong>
        <p>原视频与字幕保存在 NAS<br>仅在手动删除时清理</p>
        <button data-action="logout" class="ghost logout-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>退出登录</span>
        </button>
      </div>
    </aside>
    <div class="main-shell">
      <header>
        <div class="breadcrumb">
          <span>工作空间</span>
          <span class="sep">/</span>
          <strong id="breadcrumb">总览</strong>
        </div>
        <div class="header-right">
          <div id="connection" class="connection">
            <span class="conn-dot"></span>
            <span class="conn-text">正在连接</span>
          </div>
          <span class="avatar" title="个人用户">P</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <div>Tube2Bili <span>原声保留 · 双语字幕 · 自动转载</span></div>
        <div class="footer-version">v0.2.0</div>
      </footer>
    </div>
  </div>
  <dialog id="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="ghost modal-close" data-action="close" aria-label="关闭对话框">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
