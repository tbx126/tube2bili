services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?请在 .env 中设置至少12位密码}
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TZ: Asia/Shanghai
    volumes:
      - ${MEDIA_ROOT:-./data}:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
