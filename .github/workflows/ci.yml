name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --check app/static/app.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tube2bili:ci .
      - name: Verify container startup
        shell: bash
        run: |
          docker run -d --name tube2bili-ci -p 127.0.0.1:18080:8080 -e DASHBOARD_PASSWORD=ci-ephemeral-test-password -e DISABLE_WORKER=1 tube2bili:ci
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs tube2bili-ci
            exit 1
          fi
      - name: Stop test container
        if: always()
        run: docker rm -f tube2bili-ci || true
